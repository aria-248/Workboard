function cloneNext(t){let nd=nextDue(t.due||TODAY(),t.rep),g=0;while(nd<TODAY()&&g++<500)nd=nextDue(nd,t.rep);const ns=t.start&&t.due?dkey(addDays(parse(nd),diffDays(parse(t.due),parse(t.start)))):'';

function makeProject(o){const tpl=TPL.find(x=>x.id===o.tpl)||TPL[0],start=o.start||TODAY(),p={id:uid(),name:o.name||tpl.n,client:o.client||'',color:o.color||PCOL[S.projects.length%PCOL.length],status:'active',start,due:o.due||'',fee:+o.fee||0,notes:o.notes||'',sections:tpl.secs.map(n=>({id:uid(),name:n})),payments:[],pinned:false,created:Date.now(),doneAt:0,sample:!!o.sample};

const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],WDN=['sun','mon','tue','wed','thu','fri','sat'];
const WDRE='(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)';
const MONRE='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const wdIdx=w=>WDN.indexOf(w.slice(0,3).toLowerCase());
function nextWd(i,forceNext){const t=new Date();let d=(i-t.getDay()+7)%7;if(forceNext&&d===0)d=7;return addDays(t,d)}
function mkDate(y,m,d){const x=new Date(y,m,d);return x.getMonth()===m?x:null}
function dateFrom(d,mo,y){const m=MON.indexOf(mo.slice(0,3).toLowerCase()),t=new Date(),yy=y?+y:t.getFullYear();let x=mkDate(yy,m,d);if(!x)return null;if(!y&&diffDays(t,x)<-30)x=mkDate(yy+1,m,d);return x}
function findProj(w){const k=w.toLowerCase().replace(/[-_]/g,'');if(k.length<2)return null;return liveProjects().find(p=>p.name.toLowerCase().replace(/[\s\-_]/g,'').startsWith(k))||null}
function parseQuick(str){const o={title:'',due:'',rep:'',pri:0,tags:[],pid:null,who:''};let s=' '+String(str||'').replace(/\s+/g,' ')+' ';
 const cut=(re,fn)=>{s=s.replace(re,(...a)=>fn(...a)===false?a[0]:' ')};
 const setDue=d=>{if(d&&!o.due)o.due=dkey(d)};
 cut(/\s#([^\s#@+!]+)/g,(m,t)=>{t=t.toLowerCase();if(o.tags.indexOf(t)<0)o.tags.push(t)});
 cut(/\s@([^\s#@+!]+)/,(m,w)=>{o.who=w});
 cut(/\s\+([^\s#@+!]+)/,(m,w)=>{const p=findProj(w);if(!p)return false;o.pid=p.id});
 cut(/\s(!!!|!!|!|![123]|!(?:high|hi|h|medium|med|m|low|lo|l)|p[123])(?=\s)/i,(m,x)=>{x=x.toLowerCase();o.pri=/^(!!!|!1|!high|!hi|!h|p1)$/.test(x)?3:/^(!!|!2|!medium|!med|!m|p2)$/.test(x)?2:1});
 cut(new RegExp('\\s(?:every\\s+(\\d+)\\s+(day|week|month|year)s?|every\\s+(day|week|month|year|weekday)|(daily|weekly|monthly|yearly|weekdays|fortnightly)|every\\s+'+WDRE+')(?=\\s)','i'),(m,n,u,u2,w,wd)=>{
  if(n)o.rep=u[0].toLowerCase()+n;else if(u2){u2=u2.toLowerCase();o.rep=u2==='weekday'?'wk':u2[0]+'1'}else if(w)o.rep={daily:'d1',weekly:'w1',monthly:'m1',yearly:'y1',weekdays:'wk',fortnightly:'w2'}[w.toLowerCase()];else if(wd){o.rep='w1';setDue(nextWd(wdIdx(wd)))}});
 cut(/\s(?:(?:on|by|due)\s+)?(today|tonight)(?=\s)/i,()=>setDue(new Date()));
 cut(/\s(?:(?:on|by|due)\s+)?(tomorrow|tmrw|tmr)(?=\s)/i,()=>setDue(addDays(new Date(),1)));
 cut(/\s(?:(?:by|due)\s+)?next\s+week(?=\s)/i,()=>setDue(nextWd(1,true)));
 cut(/\s(?:(?:by|due)\s+)?next\s+month(?=\s)/i,()=>{const t=new Date();setDue(new Date(t.getFullYear(),t.getMonth()+1,1))});
 cut(/\s(?:(?:by|on)\s+)?(?:this\s+)?weekend(?=\s)/i,()=>setDue(nextWd(6)));
 cut(/\sin\s+(\d{1,3})\s+(day|week|month)s?(?=\s)/i,(m,n,u)=>{const t=new Date();n=+n;u=u.toLowerCase();setDue(u==='day'?addDays(t,n):u==='week'?addDays(t,7*n):addMonths(t,n))});
 cut(new RegExp('\\s(?:(?:on|by|due)\\s+)?(next\\s+)?'+WDRE+'(?=\\s)','i'),(m,nx,wd)=>{if(o.due)return false;setDue(nextWd(wdIdx(wd),!!nx))});
 cut(new RegExp('\\s(?:(?:on|by|due)\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+'+MONRE+'(?:\\s+(\\d{4}))?(?=\\s)','i'),(m,d,mo,y)=>{if(o.due)return false;setDue(dateFrom(+d,mo,y))});
 cut(new RegExp('\\s(?:(?:on|by|due)\\s+)?'+MONRE+'\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?(?=\\s)','i'),(m,mo,d,y)=>{if(o.due)return false;setDue(dateFrom(+d,mo,y))});
 cut(/\s(?:(?:on|by|due)\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/,(m,d,mo,y)=>{if(o.due)return false;const t=new Date(),yy=y?(+y<100?2000+(+y):+y):t.getFullYear();let x=mkDate(yy,+mo-1,+d);if(!x)return false;if(!y&&diffDays(t,x)<-30)x=mkDate(yy+1,+mo-1,+d);setDue(x)});
 cut(/\s(\d{4})-(\d{2})-(\d{2})(?=\s)/,(m,y,mo,d)=>{if(o.due)return false;const x=mkDate(+y,+mo-1,+d);if(!x)return false;setDue(x)});
 o.title=s.replace(/\s+/g,' ').trim();return o}

  return `<button class="tlbar ${cls} ${s0<0?'cl':''} ${e0>N-1?'cr':''}" style="left:${pc(s)};width:${pc(e-s+1)};--bc:${esc(col)}" data-act="${act}" data-id="${id}" title="${esc(label)}">${fill!=null?`<i style="width:${fill}%"></i>`:''}<span>${esc(label)}</span></button>`};

  ts.filter(t=>t.due).sort((a,b)=>{const x=a.start||a.due,y=b.start||b.due;return x<y?-1:x>y?1:0}).forEach(t=>{const sec=p.sections.find(x=>x.id===t.sec),a=t.start||t.due;

function viewDash(){const td=TODAY(),now=new Date(),open=S.tasks.filter(isOpen),od=open.filter(isOverdue),wk0=addDays(now,-6).getTime(),doneWk=S.tasks.filter(t=>!isOpen(t)&&t.doneAt>=wk0),act=S.projects.filter(p=>p.status==='active');

 const days=[];for(let i=13;i>=0;i--){const d=addDays(now,-i),dk=dkey(d);days.push({d,n:S.tasks.filter(t=>!isOpen(t)&&t.doneAt&&dkey(new Date(t.doneAt))===dk).length})}const mx=Math.max(1,...days.map(x=>x.n));

 h+=`<div class="card"><h2>Project health</h2>${act.length?`<div class="mt8">${act.map((p,i)=>{const s=pstats(p),hl=health(p,s);return `<button class="frow ${i?'':'first'}" style="width:100%;text-align:left" data-act="popen" data-id="${p.id}"><span class="pdot" style="--pcol:${esc(p.color)};width:12px;height:12px"></span><div class="grow"><div class="row between"><span class="b ell">${esc(p.name)}</span><span class="stage" style="--sc:${hl[1]}">${hl[0]}</span></div><div class="bar mt8"><i style="width:${s.pct}%;background:${esc(p.color)}"></i></div><div class="tiny muted mt4">${s.done}/${s.ts.length} done${s.od?' · '+s.od+' overdue':''}${p.due?' · due '+esc(rel(p.due)):''}</div></div></button>`}).join('')}</div>`:'<p class="small muted mt8">No active projects.</p>'}</div>`;

 const wl={};open.forEach(t=>{const k=t.who||'Unassigned';wl[k]=(wl[k]||0)+1});const wk=Object.keys(wl).sort((a,b)=>wl[b]-wl[a]).slice(0,8),wm=Math.max(1,...wk.map(k=>wl[k]));
 if(wk.length>1||(wk.length&&wk[0]!=='Unassigned'))h+=`<div class="card"><h2>Workload</h2><div class="tiny muted mt4">Open tasks by person</div><div class="mt12">${wk.map(k=>`<div class="hb"><div class="row between tiny"><span class="b">${esc(k)}</span><b>${wl[k]}</b></div><div class="bar mt4"><i style="width:${wl[k]/wm*100}%;background:linear-gradient(90deg,var(--a1),var(--a2))"></i></div></div>`).join('')}</div></div>`;

function runQuery(q){const toks=q.toLowerCase().match(/"[^"]+"|\S+/g)||[];let st='open';const f=[],words=[];
 toks.forEach(tk=>{tk=tk.replace(/"/g,'');const td=TODAY();
  if(tk[0]==='#'&&tk.length>1)f.push(t=>t.tags.some(g=>g.startsWith(tk.slice(1))));
  else if(tk[0]==='@'&&tk.length>1)f.push(t=>(t.who||'').toLowerCase().startsWith(tk.slice(1)));
  else if(tk[0]==='+'&&tk.length>1)f.push(t=>{const p=getP(t.pid);return !!p&&p.name.toLowerCase().replace(/\s/g,'').startsWith(tk.slice(1))});
  else if(/^(!high|!h|p1|!!!)$/.test(tk))f.push(t=>t.pri===3);else if(/^(!med|!medium|!m|p2|!!)$/.test(tk))f.push(t=>t.pri===2);else if(/^(!low|!l|p3)$/.test(tk))f.push(t=>t.pri===1);
  else if(tk==='is:done')st='done';else if(tk==='is:all')st='all';else if(tk==='is:open')st='open';
  else if(tk==='is:blocked'||tk==='is:waiting')f.push(t=>blockers(t).length>0);else if(tk==='is:repeat')f.push(t=>!!t.rep);
  else if(tk.startsWith('status:'))f.push(t=>t.status===tk.slice(7));
  else if(tk.startsWith('due:')){const v=tk.slice(4);f.push(t=>{if(v==='none')return !t.due;if(!t.due)return false;if(v==='today')return t.due===td;if(v==='overdue')return t.due<td;if(v==='tomorrow')return t.due===dkey(addDays(new Date(),1));if(v==='week')return t.due>=td&&t.due<=dkey(addDays(new Date(),6));if(v==='month')return t.due>=td&&t.due<=dkey(addDays(new Date(),30));return t.due===v})}
  else if(tk==='done:week'){st='done';const w=addDays(new Date(),-6).getTime();f.push(t=>(t.doneAt||0)>=w)}
  else if(tk==='done:today'){st='done';f.push(t=>!!t.doneAt&&dkey(new Date(t.doneAt))===td)}
  else words.push(tk)});

  const hay=(t.title+' '+t.notes+' '+(t.subs||[]).map(x=>x.t).join(' ')+' '+(p?p.name+' '+p.client:'')).toLowerCase();return words.every(w=>hay.indexOf(w)>=0)&&f.every(fn=>fn(t))})}

 const n=myDayScope().length;document.title=(n?'('+n+') ':'')+'Workboard · Commons'}
/* ================= ACTIONS ================= */
function go(v){if(SHEET)closeSheet();S.ui.view=v;ANIM=true;if(v==='myday')CNT=true;commit();window.scrollTo(0,0);
 if(v==='search')setTimeout(()=>{const q=$('#sq');if(q){q.focus();const n=q.value.length;try{q.setSelectionRange(n,n)}catch(e){}}},40)}
function ctxFromView(){const v=S.ui.view;return v==='project'?{pid:S.ui.pid}:v==='myday'?{myday:1}:v==='inbox'?{pid:''}:{}}
const withT=(el,fn)=>{const t=getT(el.dataset.id);if(!t)return;snap();fn(t);commit()};
const ACT={
 nav:el=>go(el.dataset.v),
 theme:()=>{Kit.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';Kit.saveSettings();render();if(SHEET)renderSheet()},
 personal:()=>openSheet('settings'),
 close:()=>closeSheet(),
 reload:()=>location.reload(),
 dismissrec:()=>{RECOV=0;render()},
 protectseen:()=>{Kit.meta.protectSeen=true;Kit.saveMeta();render()},
 snooze:()=>{Kit.meta.nudgeSnooze=Date.now()+3*864e5;Kit.saveMeta();render()},
 olddismiss:()=>{Kit.meta.oldSeen=true;Kit.saveMeta();render()},
 oldexp:async()=>{let raw=null;try{raw=await Kit.store.get(Kit.key('old'))}catch(e){}if(!raw){toast('Nothing saved from the earlier version');return}const r=await saveFile('workboard-earlier-version-data.json',raw,'application/json');if(r==='failed')toast('Download blocked here');else if(r!=='cancelled')toast('Earlier data downloaded')},
 fab:()=>openSheet('add',null,ctxFromView()),
 qadd:el=>doQuickAdd(el.closest('.qabox')),
 addon:el=>openSheet('add',null,{due:el.dataset.dk,pid:S.ui.view==='project'?S.ui.pid:''}),
 addsec:el=>openSheet('add',null,{pid:el.dataset.pid,sec:el.dataset.sec}),
 addstat:el=>openSheet('add',null,{pid:el.dataset.pid,status:el.dataset.v}),
 topen:el=>openSheet('task',el.dataset.id),
 tdone:el=>{const t=getT(el.dataset.id);if(!t)return;const pt=ptOf(el),before=myDayScope().length,was=t.status==='done';snap();toggleDone(t,pt);commit();
  if(was){toast('Marked not done',true);return}
  const nx=t.spawned&&getT(t.spawned);if(before>0&&!myDayScope().length&&S.ui.view==='myday'){toast('My Day is clear. Well done!',true);celebrate(null,true)}else toast(nx?'Done · next one '+rel(nx.due):'Completed',true);
  const un=S.tasks.filter(x=>isOpen(x)&&(x.deps||[]).indexOf(t.id)>=0&&!blockers(x).length);if(un.length)setTimeout(()=>toast('Unlocked: '+un[0].title+(un.length>1?' and '+(un.length-1)+' more':''),true),1600)},
 tstat:el=>withT(el,t=>setStatus(t,el.dataset.v,ptOf(el))),
 tnext:el=>{const t=getT(el.dataset.id),nx=t&&NEXT[t.status];if(!nx)return;snap();setStatus(t,nx,ptOf(el));commit();toast('Moved to '+STN[nx],true)},
 tpri:el=>withT(el,t=>{t.pri=+el.dataset.v}),
 tsun:el=>{const t=getT(el.dataset.id);if(!t)return;snap();t.myday=t.myday===TODAY()?'':TODAY();commit();toast(t.myday?'Added to My Day':'Removed from My Day')},
 tpin:el=>withT(el,t=>{t.pinned=!t.pinned}),
 tdup:el=>{const t=getT(el.dataset.id);if(!t)return;snap();const n=newTask(Object.assign(JSON.parse(JSON.stringify(t)),{id:uid(),title:t.title+' (copy)',status:'todo',doneAt:0,created:Date.now(),spawned:'',prevStatus:'',subs:t.subs.map(s=>({id:uid(),t:s.t,done:false}))}));S.tasks.push(n);SHEET.id=n.id;commit();toast('Duplicated. You’re now editing the copy.',true)},
 tdel:el=>{const id=el.dataset.id;snap();S.tasks=S.tasks.filter(x=>x.id!==id);S.tasks.forEach(x=>{x.deps=(x.deps||[]).filter(d=>d!==id)});closeSheet();commit();toast('Task deleted',true)},
 tics:el=>{const t=getT(el.dataset.id);if(t)exportICS([t],t.title)},
 sadd:el=>{const t=getT(el.dataset.id||el.dataset.tid),inp=$('#subNew'),v=((inp&&inp.value)||'').trim();if(!t)return;if(!v){if(inp)inp.focus();return}snap();t.subs.push({id:uid(),t:v,done:false});commit();const n=$('#subNew');if(n)n.focus()},
 sdone:el=>{const t=getT(el.dataset.id),x=t&&t.subs.find(s=>s.id===el.dataset.s);if(!x)return;const pt=ptOf(el);snap();x.done=!x.done;commit();if(x.done&&t.subs.every(s=>s.done)&&isOpen(t)){toast('All subtasks done. Tick the task when you’re ready.');celebrate(pt)}},
 sdel:el=>withT(el,t=>{t.subs=t.subs.filter(s=>s.id!==el.dataset.s)}),
 ddel:el=>withT(el,t=>{t.deps=(t.deps||[]).filter(d=>d!==el.dataset.d)}),
 odtoday:()=>{const td=TODAY();let n=0;snap();S.tasks.forEach(t=>{if(isOpen(t)&&t.due&&t.due<td){if(t.start&&t.start<t.due){t.start=dkey(addDays(parse(td),-diffDays(parse(t.start),parse(t.due))))}t.due=td;n++}});commit();toast(n+' task'+(n===1?'':'s')+' moved to today',true)},
 showdone:el=>{const k=el.dataset.k;S.ui.showDone[k]=!S.ui.showDone[k];commit()},
 donetoday:()=>{S.ui.hideDoneToday=!S.ui.hideDoneToday;commit()},
 pf:el=>{S.ui.pf=el.dataset.v;commit()},
 pnew:()=>openSheet('project'),
 pedit:el=>openSheet('project',el.dataset.id),
 popen:el=>{if(SHEET)closeSheet();S.ui.view='project';S.ui.pid=el.dataset.id;ANIM=true;commit();window.scrollTo(0,0)},
 pmoney:el=>{S.ui.pview='money';ACT.popen(el)},
 pview:el=>{S.ui.pview=el.dataset.v;commit()},
 ppin:el=>{const p=getP(el.dataset.id);if(!p)return;p.pinned=!p.pinned;commit();toast(p.pinned?'Pinned to the top':'Unpinned')},
 pcomplete:el=>{const p=getP(el.dataset.id);if(!p)return;snap();p.status='done';p.doneAt=Date.now();commit();celebrate(null,true);toast('Project complete 🎉',true);openSheet('summary',p.id)},
 pdel:el=>{const id=el.dataset.id;if(ARM!=='p'+id){ARM='p'+id;renderSheet();return}snap();S.projects=S.projects.filter(p=>p.id!==id);const gone=new Set(S.tasks.filter(t=>t.pid===id).map(t=>t.id));S.tasks=S.tasks.filter(t=>!gone.has(t.id));S.tasks.forEach(t=>{t.deps=(t.deps||[]).filter(d=>!gone.has(d))});closeSheet();S.ui.view='projects';commit();toast('Project deleted',true)},
 psum:el=>openSheet('summary',el.dataset.id),
 pics:el=>{const p=getP(el.dataset.id);if(p)exportICS(tasksOf(p.id).filter(t=>isOpen(t)&&t.due),p.name)},
 sprint:el=>{const p=getP(el.dataset.id);if(!p)return;$('#print').innerHTML=summaryBody(p);setTimeout(()=>{try{window.print()}catch(e){toast('Printing is blocked here. Download the file instead.')}},60)},
 sdl:el=>{const p=getP(el.dataset.id);if(!p)return;const doc=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.name)} · Summary</title><style>body{margin:0;background:#f2f2f7;padding:24px}${SUMCSS}@media print{body{background:#fff;padding:0}.sum{padding:0}}</style></head><body>${summaryBody(p)}</body></html>`;
  saveFile(slug(p.name)+'-summary.html',doc,'text/html').then(r=>{if(r==='failed')toast('Download blocked here');else if(r!=='cancelled')toast('Summary saved. Open it and print to PDF.')})},
 payadd:el=>{const p=getP(el.dataset.id),amt=+(($('#payAmt')||{}).value||0);if(!p)return;if(!(amt>0)){toast('Enter an amount');const a=$('#payAmt');if(a)a.focus();return}snap();p.payments=p.payments||[];p.payments.push({id:uid(),date:(($('#payDate')||{}).value)||TODAY(),amount:amt,note:((($('#payNote')||{}).value)||'').trim()});commit();const s=pstats(p);toast('Payment recorded'+(p.fee?' · '+(s.bal>0?money(s.bal)+' to go':'fully paid'):''),true);if(p.fee&&s.bal<=0)celebrate(null,true)},
 paydel:el=>{const p=getP(el.dataset.id);if(!p)return;snap();p.payments=p.payments.filter(x=>x.id!==el.dataset.x);commit();toast('Payment removed',true)},
 copyrem:async el=>{const p=getP(el.dataset.id);if(!p)return;toast(await copyText(remindText(p,pstats(p).bal))?'Reminder copied':'Couldn’t copy here')},
 secnew:el=>openSheet('section',el.dataset.pid,{sec:''}),
 secedit:el=>openSheet('section',el.dataset.pid,{sec:el.dataset.sec}),
 secsave:()=>{if(!SHEET)return;const p=getP(SHEET.id),sid=SHEET.extra.sec,v=(($('#secName')||{}).value||'').trim();if(!p)return;if(!v){toast('Name the section');return}snap();if(sid){const s=p.sections.find(x=>x.id===sid);if(s)s.name=v}else p.sections.push({id:uid(),name:v});closeSheet();commit();toast(sid?'Section renamed':'Section added',true)},
 secmove:el=>{const p=getP(SHEET.id);if(!p)return;const i=p.sections.findIndex(x=>x.id===SHEET.extra.sec),j=i+(+el.dataset.d);if(i<0||j<0||j>=p.sections.length)return;snap();const x=p.sections.splice(i,1)[0];p.sections.splice(j,0,x);commit()},
 secdel:()=>{if(ARM!=='sec'){ARM='sec';renderSheet();return}const p=getP(SHEET.id),sid=SHEET.extra.sec;if(!p)return;snap();p.sections=p.sections.filter(x=>x.id!==sid);S.tasks.forEach(t=>{if(t.pid===p.id&&t.sec===sid)t.sec=''});closeSheet();commit();toast('Section deleted. Its tasks were kept.',true)},
 calday:el=>openSheet('day',el.dataset.dk,{pid:S.ui.view==='project'?S.ui.pid:''}),
 calnav:el=>{const d=+el.dataset.d,r=parse(S.ui.calRef||TODAY());S.ui.calRef=dkey(S.ui.cal==='week'?addDays(r,7*d):new Date(r.getFullYear(),r.getMonth()+d,1));commit()},
 caltoday:()=>{S.ui.calRef='';commit()},
 calmode:el=>{S.ui.cal=el.dataset.v;commit()},
 tlnav:el=>{const r=S.ui.tlRef?parse(S.ui.tlRef):addDays(new Date(),-7);S.ui.tlRef=dkey(addDays(r,14*(+el.dataset.d)));commit()},
 tltoday:()=>{S.ui.tlRef='';commit()},
 qset:el=>{S.ui.q=el.dataset.q;go('search')},
 fsave:()=>{const q=(S.ui.q||'').trim();if(!q)return;if(S.filters.some(f=>f.q===q)){toast('Already saved');return}S.filters.push({id:uid(),name:q,q});commit();toast('Saved to Filters')},
 fdel:el=>{snap();S.filters=S.filters.filter(f=>f.id!==el.dataset.id);commit();toast('Filter removed',true)},
 undo:()=>undo(),
 exp:()=>{Kit.backupNow().then(ok=>{if(ok)commit()})},
 copy:async()=>{await Kit.flush();const d=JSON.stringify(Kit.backupObject());if(await copyText(d)){Kit.markBackedUp();toast('Backup text copied. Paste it somewhere safe.')}else{const ta=$('#impTxt');if(ta){ta.value=d;ta.focus();ta.select()}toast('Select all and copy')}},
 imp:()=>{const v=(($('#impTxt')||{}).value||'').trim();if(!v){toast('Paste a backup first');return}try{PENDING=parseAny(v);renderSheet()}catch(e){toast(e.message)}},
 rfile:()=>$('#restoreInput').click(),
 rsnap:async()=>{const s=await Kit.latestSnapshot();if(!s){toast('No recovery copy yet');return}const d=normalize(s.state);PENDING={kind:'snapshot',data:d,summary:TOOL.summary(d),exportedAt:new Date(s.at).toISOString()};renderSheet()},
 rconfirm:()=>{applyPending()},
 rcancel:()=>{PENDING=null;renderSheet()},
 persist:()=>{Kit.askPersist().then(()=>{if(SHEET)renderSheet()})},
 fchoose:()=>{Kit.file.choose().then(()=>{if(SHEET)renderSheet()})},
 fresume:()=>{Kit.file.resume().then(()=>commit())},
 fstop:()=>{Kit.file.stop().then(()=>{if(SHEET)renderSheet()})},
 sample:()=>{snap();loadSample();commit();toast('Sample projects added',true)},
 unsample:()=>{snap();const ids=new Set(S.projects.filter(p=>p.sample).map(p=>p.id));S.projects=S.projects.filter(p=>!p.sample);S.tasks=S.tasks.filter(t=>!t.sample&&!ids.has(t.pid));if(S.ui.view==='project'&&ids.has(S.ui.pid))S.ui.view='projects';commit();toast('Sample projects removed',true)},
 reset:async()=>{if(ARM!=='reset'){ARM='reset';renderSheet();return}await Kit.snapshot('before-reset');S=fresh();UNDO=[];closeSheet();commit();toast('All data erased. A recovery copy was kept.')}
};

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=ACT[el.dataset.act];if(a){e.preventDefault();a(el,e)}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='startForm')startApp(f);else if(f.id==='projForm')saveProject(f)});
document.addEventListener('keydown',e=>{const tg=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable;
 if(e.key==='Escape'&&SHEET){flushField();closeSheet();return}
 if(e.key==='Enter'&&!e.shiftKey){
  if(tg.classList&&tg.classList.contains('qa')){e.preventDefault();doQuickAdd(tg.closest('.qabox'));return}
  if(tg.id==='subNew'){e.preventDefault();ACT.sadd(tg);return}
  if(tg.dataset&&tg.dataset.tf==='title'){e.preventDefault();tg.blur();return}
  if(tg.id==='secName'){e.preventDefault();ACT.secsave();return}
  if(tg.id==='payAmt'||tg.id==='payNote'){e.preventDefault();const b=document.querySelector('[data-act=payadd]');if(b)ACT.payadd(b);return}}
 if(!typing&&(e.key==='Enter'||e.key===' ')&&tg.getAttribute&&tg.getAttribute('role')==='button'&&tg.dataset.act){e.preventDefault();tg.click();return}
 if(typing||e.altKey)return;
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();return}
 if(e.metaKey||e.ctrlKey||!S.started)return;
 if(e.key==='n'||e.key==='N'){e.preventDefault();if(!SHEET)ACT.fab()}
 else if(e.key==='/'){e.preventDefault();go('search')}
 else if(/^[1-7]$/.test(e.key)&&!SHEET)go(NAV[+e.key-1][0])});
document.addEventListener('input',e=>{const t=e.target;
 if(t.classList&&t.classList.contains('qa')){const box=t.closest('.qabox'),pv=box&&box.querySelector('.qaprev');if(pv)pv.innerHTML=t.value.trim()?qaChips(parseQuick(t.value)):''}
 if(t.id==='sq'){S.ui.q=t.value;const r=$('#sres');if(r)r.innerHTML=searchResults();Kit.save(S)}
 if(t.classList&&t.classList.contains('ttlin'))autosize(t)});
document.addEventListener('change',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.set){Kit.settings[ds.set]=t.value;Kit.saveSettings();render();return}
 if(ds.me){const v=String(t.value||'').trim();if(S.me[ds.me]===v)return;S.me[ds.me]=v;const text=t.tagName==='INPUT'&&t.type!=='radio';commit(!text);if(text)toast('Saved');return}
 if(ds.tf&&SHEET&&SHEET.type==='task'){const task=getT(SHEET.id);if(!task)return;const f=ds.tf,v=t.value;
  if(f==='title'){const x=v.trim();if(!x){t.value=task.title;return}if(x===task.title)return;snap();task.title=x}
  else if(f==='notes'){if(v===task.notes)return;snap();task.notes=v}
  else{snap();if(f==='due'){task.due=v;if(task.start&&v&&task.start>v)task.start='';if(!v)task.rep=''}
   else if(f==='start'){task.start=v;if(v&&task.due&&v>task.due)task.due=v}
   else if(f==='rep'){task.rep=v;if(v&&!task.due)task.due=TODAY()}
   else if(f==='who')task.who=v.trim();
   else if(f==='pid'){task.pid=v;task.sec='';task.deps=[]}
   else if(f==='sec')task.sec=v;
   else if(f==='tags')task.tags=v.split(/[,\s]+/).map(x=>x.replace(/^#/,'').toLowerCase().trim()).filter((x,i,a)=>x&&a.indexOf(x)===i)}
  commit(t.tagName==='SELECT'||t.type==='date');return}
 if(ds.sub){const task=getT(ds.tid),x=task&&task.subs.find(s=>s.id===ds.sub);if(!x)return;const v=t.value.trim();snap();if(v)x.t=v;else task.subs=task.subs.filter(s=>s.id!==ds.sub);commit(!v);return}
 if(t.id==='depAdd'&&t.value){const task=getT(ds.tid);if(!task)return;snap();task.deps=(task.deps||[]).concat(t.value);commit();toast('Now waiting on that task')}});
document.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;DRAG=el.dataset.drag;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG)}catch(x){}el.classList.add('dragging')});
document.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{if(!DRAG)return;const z=e.target.closest&&e.target.closest('[data-drop]');document.querySelectorAll('.over').forEach(x=>{if(x!==z)x.classList.remove('over')});if(!z)return;e.preventDefault();e.dataTransfer.dropEffect='move';z.classList.add('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z||!DRAG)return;e.preventDefault();const t=getT(DRAG);DRAG=null;if(!t)return;const i=z.dataset.drop.indexOf(':'),kind=z.dataset.drop.slice(0,i),val=z.dataset.drop.slice(i+1);let msg='';
 if(kind==='status'){if(t.status===val){render();return}snap();setStatus(t,val,ptOf(z));msg='Moved to '+STN[val]}
 else if(kind==='date'){const nd=val==='none'?'':val;if(t.due===nd){render();return}snap();if(t.start&&t.due&&nd){t.start=dkey(addDays(parse(nd),-diffDays(parse(t.start),parse(t.due))))}else if(!nd)t.start='';t.due=nd;if(!nd)t.rep='';msg=nd?'Moved to '+rel(nd):'Date removed'}
 else if(kind==='sec'){const ns=val==='none'?'':val;if((t.sec||'')===ns){render();return}snap();t.sec=ns;msg='Moved'}
 commit();if(msg)toast(msg,true)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.started&&!SHEET)render()});
let lastDay=TODAY();setInterval(()=>{if(TODAY()!==lastDay){lastDay=TODAY();if(!SHEET)render()}},60000);
$('#restoreInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;try{PENDING=parseAny(await f.text());if(!SHEET||SHEET.type!=='settings')openSheet('settings',null,{scroll:'dataCard'});else renderSheet()}catch(err){toast(err.message)}});

/* ================= BOOT ================= */
(async function init(){const fb=setTimeout(()=>{if(!touched)render()},3000);
 document.getElementById('sumcss').textContent=SUMCSS;
 try{await Kit.init(TOOL);const r=await Kit.load();
  if(r.corrupt){try{const raw=await Kit.store.get(Kit.key('state'));if(raw){await Kit.store.set(Kit.key('old'),raw);Kit.meta.hasOld=true;Kit.meta.oldSeen=false;Kit.saveMeta()}}catch(e){}}
  if(r.state){S=normalize(r.state)||fresh();if(r.source==='snapshot'){RECOV=r.snapAt;Kit.save(S)}}
  Kit.meta.lastOpened=TODAY();Kit.saveMeta();
  if(S.started&&!(Kit.meta.snaps||[]).length)Kit.snapshot('first');else if(S.started&&Date.now()-(Kit.status.snapAt||0)>36e5)Kit.snapshot('daily',S);
 }catch(e){console.error(e)}
 clearTimeout(fb);CNT=true;ANIM=true;render()})();
})();
</script>
</body>
